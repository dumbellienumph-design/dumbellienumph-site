<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Transmission — FieldAI</title>
    
    <!-- Engine Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000000;
            --accent: #00ff88;
            --purple: #7c3aed;
            --text: #ffffff;
            --muted: #444444;
            --border: #151515;
            --ease: cubic-bezier(0.8, 0, 0.1, 1);
        }

        /* --- THE CORE SHELL --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; cursor: none !important; }
        html.lenis { height: auto; }
        .lenis.lenis-smooth { scroll-behavior: auto !important; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.2; overflow-x: hidden; }

        /* --- BACKGROUND LAYERS --- */
        #main-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; opacity: 0.6; }
        #intro-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1002; pointer-events: none; }
        
        .grain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; pointer-events: none; opacity: 0.07; 
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); 
        }

        #cursor { position: fixed; width: 8px; height: 8px; background: #fff; border-radius: 50%; z-index: 10001; pointer-events: none; mix-blend-mode: difference; transition: transform 0.3s var(--ease); }
        #spotlight { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; background: radial-gradient(circle 250px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.05), transparent 100%); }

        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; width: 100%; height: 120px; z-index: 1000; display: flex; align-items: center; padding: 0 5vw; transition: 0.5s var(--ease); }
        nav.scrolled { height: 80px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
        .nav-content { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Bebas Neue'; font-size: 2.5rem; letter-spacing: 4px; text-decoration: none; color: #fff; }
        .nav-links { display: flex; gap: 50px; }
        .nav-links a { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; text-decoration: none; color: #fff; opacity: 0.3; transition: 0.4s; }
        .nav-links a:hover, .nav-links a.active { opacity: 1; color: var(--accent); }

        /* --- TYPOGRAPHY ENGINE --- */
        .reveal-container { overflow: hidden; display: block; }
        .word { display: inline-block; transform: translateY(110%); }
        h1 { font-family: 'Bebas Neue'; font-size: 14vw; text-transform: uppercase; letter-spacing: -3px; line-height: 0.8; }
        
        /* --- LAYOUT --- */
        section { position: relative; z-index: 1; padding: 20vh 5vw; min-height: 100vh; display: flex; align-items: center; }
        .container { width: 100%; max-width: 1600px; margin: 0 auto; }

        /* --- FORM (EDITORIAL LUXURY) --- */
        .contact-box { max-width: 1000px; background: #030303; padding: 120px 100px; border: 1px solid var(--border); position: relative; }
        .contact-box h2 { font-family:'Bebas Neue'; font-size: 8vw; line-height: 0.85; margin-bottom: 40px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 80px; }
        .input-group { margin-bottom: 60px; border-bottom: 1px solid var(--border); transition: 0.4s; }
        .input-group:focus-within { border-color: var(--accent); }
        .input-group label { font-size: 10px; font-weight: 900; color: var(--muted); letter-spacing: 3px; display: block; margin-bottom: 20px; }
        input, select, textarea { width: 100%; background: transparent; border: none; color: #fff; font-family: 'Inter'; font-size: 2rem; padding-bottom: 20px; outline: none; font-weight: 100; }

        .btn { padding: 28px 60px; font-family: 'Bebas Neue'; font-size: 1.8rem; text-decoration: none; text-transform: uppercase; transition: 0.5s var(--ease); display: inline-block; border-radius: 0; position: relative; border: 1px solid transparent; text-align: center; cursor: pointer; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { transform: translateY(-10px) rotate(-2deg); box-shadow: 30px 30px 0 rgba(0, 255, 136, 0.05); }

        footer { padding: 120px 5vw; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
        .footer-logo { font-family: 'Bebas Neue'; font-size: 5rem; line-height: 0.8; letter-spacing: -2px; }

        @media (max-width: 1024px) {
            h1 { font-size: 22vw; }
            .field-row { grid-template-columns: 1fr; gap: 40px; }
            .contact-box { padding: 60px 40px; }
            nav .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div class="grain"></div>
    <div id="spotlight"></div>
    <canvas id="main-canvas"></canvas>
    <canvas id="intro-canvas"></canvas>

    <nav id="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">FieldAI</a>
            <div class="nav-links">
                <a href="whatsapp-automation.html">WhatsApp</a>
                <a href="reception-automation.html">Reception</a>
                <a href="web-building.html">Web</a>
                <a href="autoflow.html">AutoFlow</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        <section>
            <div class="container">
                <div class="contact-box">
                    <p style="color: var(--accent); letter-spacing: 10px; font-size: 12px; font-weight: 900; margin-bottom: 40px;">INITIALIZE TRANSMISSION</p>
                    <div class="reveal-container"><h2>LET'S BUILD</h2></div>
                    <div class="reveal-container"><h2 style="color: var(--accent);">THE FUTURE.</h2></div>
                    
                    <form action="https://formspree.io/f/xwpbqdnl" method="POST">
                        <div class="field-row">
                            <div class="input-group">
                                <label>IDENTIFIER</label>
                                <input type="text" name="name" placeholder="YOUR NAME" required>
                            </div>
                            <div class="input-group">
                                <label>CHANNEL</label>
                                <input type="email" name="email" placeholder="YOUR EMAIL" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>OBJECTIVE</label>
                            <textarea name="message" placeholder="TELL US ABOUT THE CHALLENGE..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; border: none;">Initialize Deployment</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-logo">FieldAI</div>
        <div style="text-align: right;">
            <p style="color:var(--muted); font-size: 11px; letter-spacing: 3px; margin-bottom: 10px;">JOHANNESBURG, SA · GLOBAL SHIPPING</p>
            <p style="color:var(--muted); font-size: 11px; letter-spacing: 3px;">© 2026 FIELDAI · STRATEGIC GROWTH</p>
        </div>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        class CyberConvergence {
            constructor() {
                this.canvas = document.getElementById('intro-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.lines = []; this.particles = []; this.converged = false;
                this.resize(); window.addEventListener('resize', () => this.resize());
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; }
            init() {
                const cX = this.canvas.width/2; const cY = this.canvas.height/2;
                for(let i=0; i<15; i++) {
                    const angle = Math.random()*Math.PI*2; const dist = Math.max(this.canvas.width, this.canvas.height);
                    this.lines.push({ x: cX + Math.cos(angle)*dist, y: cY + Math.sin(angle)*dist, tX: cX, tY: cY, p: 0, s: 0.02 + Math.random()*0.02 });
                }
            }
            explode() {
                const cX = this.canvas.width/2; const cY = this.canvas.height/2;
                for(let i=0; i<300; i++) this.particles.push({ x: cX, y: cY, vx: (Math.random()-0.5)*40, vy: (Math.random()-0.5)*40, l: 1, s: Math.random()*4+1 });
            }
            draw() {
                this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                if(!this.converged) {
                    this.ctx.strokeStyle = '#00ff88'; this.ctx.lineWidth = 2; let all = true;
                    this.lines.forEach(l => {
                        l.p += l.s; if(l.p > 1) l.p = 1; else all = false;
                        this.ctx.beginPath(); this.ctx.moveTo(l.x, l.y);
                        this.ctx.lineTo(l.x + (l.tX - l.x)*l.p, l.y + (l.tY - l.y)*l.p);
                        this.ctx.stroke();
                    });
                    if(all) { this.converged = true; this.explode(); window.dispatchEvent(new CustomEvent('forge')); }
                }
                this.particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.l -= 0.015;
                    this.ctx.fillStyle = `rgba(0, 255, 136, ${p.l})`;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); this.ctx.fill();
                    if(p.l <= 0) this.particles.splice(i,1);
                });
                requestAnimationFrame(() => this.draw());
            }
        }

        class GlobalParticleSystem {
            constructor() {
                this.canvas = document.getElementById('main-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = []; this.count = 100;
                this.resize(); window.addEventListener('resize', () => this.resize());
                this.init();
            }
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; this.docH = document.documentElement.scrollHeight; }
            init() { for (let i=0; i<this.count; i++) this.particles.push(this.createParticle(Math.random()*this.docH)); this.animate(); }
            createParticle(y = null) {
                const isStream = Math.random() > 0.85;
                return {
                    y: y !== null ? y : this.docH + 50,
                    startX: Math.random()*this.canvas.width,
                    speed: 2 + Math.random()*3,
                    size: isStream ? 2 : Math.random()*2+1,
                    color: Math.random() > 0.5 ? '#00ff88' : '#7c3aed',
                    isStream, laneOffset: (Math.random()-0.5)*400, points: [], lastSwitch: 0
                };
            }
            animate() {
                this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
                const scrollY = window.scrollY;
                this.particles.forEach(p => {
                    p.y -= p.speed;
                    if(p.y < 0) Object.assign(p, this.createParticle());
                    if(p.isStream && Math.random() > 0.98 && (performance.now() - p.lastSwitch > 1000)) { p.laneOffset += (Math.random()-0.5)*200; p.lastSwitch = performance.now(); }
                    const progress = 1 - (p.y / this.docH);
                    const curX = (p.startX + p.laneOffset) + (this.canvas.width/2 - (p.startX + p.laneOffset)) * progress;
                    const sY = p.y - scrollY;
                    if(sY > -100 && sY < this.canvas.height + 100) {
                        this.ctx.globalAlpha = Math.sin(progress * Math.PI);
                        if(p.isStream) {
                            p.points.push({x: curX, y: sY}); if(p.points.length > 20) p.points.shift();
                            this.ctx.strokeStyle = p.color; this.ctx.lineWidth = 1.5; this.ctx.beginPath();
                            p.points.forEach((pt, i) => i === 0 ? this.ctx.moveTo(pt.x, pt.y) : this.ctx.lineTo(pt.x, pt.y));
                            this.ctx.stroke();
                        } else {
                            this.ctx.fillStyle = p.color; this.ctx.beginPath(); this.ctx.arc(curX, sY, p.size, 0, Math.PI*2); this.ctx.fill();
                        }
                    }
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        const intro = new CyberConvergence(); intro.init(); intro.draw();
        new GlobalParticleSystem();

        window.addEventListener('forge', () => {
            gsap.to(".word", { y: 0, duration: 1.5, stagger: 0.1, ease: "expo.out" });
            gsap.to("#intro-canvas", { opacity: 0, duration: 2, delay: 2 });
        });

        const cursor = document.getElementById('cursor');
        window.addEventListener("mousemove", e => {
            gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0.15 });
            document.body.style.setProperty('--x', `${e.clientX}px`);
            document.body.style.setProperty('--y', `${e.clientY}px`);
        });

        document.querySelectorAll('.btn, a').forEach(el => {
            el.addEventListener('mouseenter', () => gsap.to(cursor, { scale: 10 }));
            el.addEventListener('mouseleave', () => gsap.to(cursor, { scale: 1 }));
            if(el.classList.contains('btn')) {
                el.addEventListener('mousemove', (e) => {
                    const rect = el.getBoundingClientRect();
                    gsap.to(el, { x: (e.clientX - rect.left - rect.width/2)*0.3, y: (e.clientY - rect.top - rect.height/2)*0.3, duration: 0.3 });
                });
                el.addEventListener('mouseleave', () => gsap.to(el, { x:0, y:0, duration: 0.5, ease: "elastic.out(1,0.3)" }));
            }
        });

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) document.getElementById('navbar').classList.add('scrolled');
            else document.getElementById('navbar').classList.remove('scrolled');
        });
    </script>
</body>
</html>
